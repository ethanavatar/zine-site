<extend template="photos-template.shtml">
<head id="head">
    <link type="text/css" rel="stylesheet" href="$site.asset('gallery.css').link()">
</head>
<body id="body">
    <nav style="justify-content: center; font-size: 1.5rem;">
        <div style="margin-top: 1rem;">
            <a href="$site.page('photos').link()">Home</a>
        </div>

        <div style="margin-top: 1rem;">
            &nbsp; •&nbsp;
            <a href="$site.page('photos').link().addPath('galleries')">Galleries</a>
        </div>
    </nav>

    <div class="outer-thumbs">
        <div id="thumbs" class="thumbs" :loop="$site.asset('galleries.json').ziggy()">
            <a href="$site.page('photos').link().addPath($loop.it.get('name'))" class="thumb-anchor">
                <img class="thumb" loading="lazy" src="$loop.it.get('thumbnail')" alt="">

                <div style="margin-top: 0.75rem;">
                    <div class="gallery-name" :text="$loop.it.get('name')"></div>
                    <div class="gallery-date" :text="$loop.it.get('date')"></div>
                </div>
            </a>
        </div>
    </div>

</body>
