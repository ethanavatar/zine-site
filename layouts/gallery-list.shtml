<extend template="photos-template.shtml">
<head id="head">
    <style>
        .gallery-title {
            font-size: 1rem;
            font-weight: bold;
        }

        .gallery-subtitle {
            font-size: 0.75rem;
        }
    </style>
</head>
<body id="body">
    <div class="outer-thumbs">
        <div id="thumbs" class="thumbs" :loop="$site.asset('db.ziggy').ziggy()">
            <a href="$site.page('photos').link().addPath($loop.it.get('id'))" class="thumb-anchor">
                <img class="thumb"
                     loading="lazy"
                     alt=""
                     src="$site.asset($loop.it.get('thumbnail')).link()">

                <div style="margin-top: 0.75rem; margin-bottom: 0.75rem;">
                    <div class="gallery-title"    :text="$loop.it.get('title')"></div>
                    <div class="gallery-subtitle" :text="$loop.it.get('subtitle')"></div>
                </div>
            </a>
        </div>
    </div>

</body>
