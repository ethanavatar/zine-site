<extend template="photos-template.shtml">
<head id="head">
  <style>
    .date {
      font-size: 0.9em;
    }
    
    .title h3 {
      margin-top: 0;
    }

    body {
        width:  100% !important;
        padding: 0px !important;
        margin:  0px !important;
    }

    body:has(.modal:is(:target)) {
        overflow: hidden;
    }

    .outer-thumbs {
        width: calc(100% - 40px);
        padding: 20px;
    }

    .thumbs {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;

      justify-content: space-between;
      align-content: flex-start;
      align-items: stretch;

      width: 100%;
      resize: both;
    }

    .thumb-anchor {
      position: relative;
      display: inline-block;
      flex: 1 0 auto;
      margin: 2px;
    }

    .thumb-anchor:hover {
      z-index: 1;
    }

    .thumb {
      display: block;
      height: 200px;
      width: 100%;

      object-fit: cover;
      object-position: 50% 50%;

      transition: transform 400ms;
    }

    .thumb:hover {
      /* zoom: */
      box-shadow: 0px 0px 10px 0px rgba(0,0,0, 0.7);
      transform: scale(1.2, 1.2);
    }

    .thumb > div {
      font-family: "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #fff;
      padding: 0px 2px;
      overflow: hidden;
    }
    .thumb > div > span {
      display: block;
    }
    .thumb > div > span:first-child { /* title */
      font-weight: bold;
    }
    .thumb > div > span:last-child { /* subtext */
      font-size: 0.8em;
    }

    .thumb-txt > div {
      display: block;
      width: auto;
      height: 100%;
    }

    .thumbs:after {
      content: "";
      flex: 100 0 auto;
    }

    .close {
      position: absolute;
      text-decoration: none;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
    }
    
    .close:hover,
    .close:focus {
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }

    @media only screen and (max-width: 700px){
      .responsive {
        width: 49.99999%;
        margin: 6px 0;
      }
      .modal-content {
        width: 100%;
      }
    }

    @media only screen and (max-width: 500px){
      .responsive {
        width: 100%;
      }
    }

    /* Clear Floats */
    .clearfix:after {
      content: "";
      display: table;
      clear: both;
    }

    /* The Modal (background) */
    .modal {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */
      overflow: auto;

      z-index: 100; /* Sit on top */

      left: 0;
      top: 0;

      width: 100%;  /* Full width */
      height: 100%; /* Full height */

      overflow: auto; /* Enable scroll if needed */

      background-color: rgb(0,0,0); /* Fallback color */
      background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
    }

    /* Modal Content (image) */
    .modal-content {
      position: fixed;
      left: 50%;
      top: 50%;

      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);

      max-width: calc(100dvw - 160px);
      max-height: calc(100dvh - 160px);
    }

    .modal:is(:target)  { display: block; }
    .modal:not(:target) { display: none; }

    .modal-fill {
        z-index: -1;
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
    }

  </style>
</head>
<body id="body">
    <h1 class="site-title" style="text-align: center;">Photos</h1>

    <div class="outer-thumbs">
        <div id="thumbs" class="thumbs" :loop="$site.asset('photos.json').ziggy()">
            <a href="$loop.it.get('name').prefix('#')" class="thumb-anchor">
                <div :if="$loop.it.get('kind').eql('remote')">
                    <img class="thumb" loading="lazy" src="$loop.it.get('img')" alt="">
                </div>

                <div :if="$loop.it.get('kind').eql('site')">
                    <img class="thumb" loading="lazy" src="$site.asset($loop.it.get('img')).link()" alt="">
                </div>
            </a>

            <div class="modal" id="$loop.it.get('name')">
                <a href="#!" class="modal-fill">
                    <div class="close">×</div>
                </a>

                <div :if="$loop.it.get('kind').eql('remote')">
                    <img loading="lazy" class="modal-content" src="$loop.it.get('img')" alt="">
                </div>

                <div :if="$loop.it.get('kind').eql('site')">
                    <img loading="lazy" class="modal-content" src="$site.asset($loop.it.get('img')).link()" alt="">
                </div>
            </div>
        </div>
    </div>
</body>
