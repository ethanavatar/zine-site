<extend template="photos-template.shtml">
<head id="head">
  <style>
    .date {
      font-size: 0.9em;
    }
    
    .title h3 {
      margin-top: 0;
    }

    body {
        width:  100% !important;
        padding: 0px !important;
        margin:  0px !important;
    }

    .outer-thumbs {
        width: calc(100% - 40px);
        padding: 20px;
    }

    .thumbs {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: space-between;
      align-content: flex-start;
      align-items: stretch;

      /* for demo: */
      width: 100%;
      border: 1px solid #ccc;
      resize: both;
    }

    .thumb {
      position: relative;
      display: inline-block;
      flex: 1 0 auto;

      width: auto;
      height: 200px;

      /* cosmetics and zoom: */
      margin: 2px;
      text-decoration: none;
      background-color: rgba(0,0,0, 0.50);
      box-shadow: 0px 0px 0px 0px rgba(0,0,0, 0.0);
      transition: box-shadow 300ms, transform 400ms, z-index 400ms, background-position 400ms;
      z-index: 1;
    }

    .thumb:hover {
      /* zoom: */
      box-shadow: 0px 0px 10px 0px rgba(0,0,0, 0.7);
      transform: scale(1.2, 1.2);
      z-index: 1;
    }

    .thumb-img {
      background-size: cover;
      background-position: 50% 50%;
      background-repeat: no-repeat;
    }

    .thumb-img > img {
      display: block;
      height: 100%;
      opacity: 0;
    }

    .thumb > div {
      font-family: "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #fff;
      padding: 0px 2px;
      overflow: hidden;
    }
    .thumb > div > span {
      display: block;
    }
    .thumb > div > span:first-child { /* title */
      font-weight: bold;
    }
    .thumb > div > span:last-child { /* subtext */
      font-size: 0.8em;
    }

    .thumb-img > div {
      display: block;
      position: absolute;
      bottom: 0px;
      left: 0px;
      width: 100%;
      white-space: nowrap;
      background-color: rgba(0,0,0, 0.30);
      opacity: 0;
      transition: opacity 300ms;
    }
    .thumb-img > div > span { /* title */
      font-size: 0.8em;
    }
    .thumb-img:hover > div { /* content */
      opacity: 1;
    }

    .thumb-txt > div {
      display: block;
      width: auto;
      height: 100%;
    }

    .thumbs:after {
      content: "";
      flex: 100 0 auto;
    }

    .close {
      position: absolute;
      text-decoration: none;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
    }
    
    .close:hover,
    .close:focus {
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }

    @media only screen and (max-width: 700px){
      .responsive {
        width: 49.99999%;
        margin: 6px 0;
      }
      .modal-content {
        width: 100%;
      }
    }

    @media only screen and (max-width: 500px){
      .responsive {
        width: 100%;
      }
    }

    /* Clear Floats */
    .clearfix:after {
      content: "";
      display: table;
      clear: both;
    }

    /* The Modal (background) */
    .modal {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */

      z-index: 100; /* Sit on top */

      left: 0;
      top: 0;

      width: 100%;  /* Full width */
      height: 100%; /* Full height */

      overflow: auto; /* Enable scroll if needed */

      background-color: rgb(0,0,0); /* Fallback color */
      background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
    }

    /* Modal Content (image) */
    .modal-content {
      margin: auto;
      margin-top: 100px;

      display: block;
      width: auto;
      max-height: calc(100dvh - 10%);
    }

    .modal:is(:target)  { display: block; }
    .modal:not(:target) { display: none; }

    .modal-fill {
      z-index: -1;
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
    }

  </style>
</head>
<body id="body">

    <h1 class="site-title">Photos</h1>

    <div class="outer-thumbs">
        <div id="thumbs" class="thumbs" :loop="$site.asset('photos.json').ziggy()">
            <a href="$loop.it.get('name').prefix('#focus-')"
               class="thumb thumb-img"
               style="$loop.it.get('img').prefix('background-image: url(').suffix(')')">

              <img src="$loop.it.get('img')" alt="">
            </a>

            <div class="modal" id="$loop.it.get('name').prefix('focus-')">
                <a href="#!" class="modal-fill">
                    <div class="close">×</div>
                </a>
                <img class="modal-content" src="$loop.it.get('img')" alt="">
            </div>
        </div>
    </div>
</body>
