<extend template="photos-template.shtml">
<head id="head">
  <style>
    body {
        width:  100% !important;
        padding: 0rem !important;
        margin:  0rem !important;
    }

    body:has(.modal:is(:target)) {
        overflow: hidden;
    }

    .outer-thumbs {
        width: calc(100% - 2rem);
        padding: 1rem;
    }

    .thumbs {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;

      justify-content: space-between;
      align-content: flex-start;
      align-items: stretch;

      width: 100%;
      resize: both;
    }

    .thumb-anchor {
      position: relative;
      display: inline-block;
      flex: 1 0 auto;
      margin: 0.2rem;
    }

    .thumb-anchor:hover {
      z-index: 1;
    }

    .thumb {
      display: block;
      height: 10rem;
      width: 100%;

      object-fit: cover;
      object-position: 50% 50%;

      transition: transform 250ms, z-index 250ms;
      z-index: 1;
    }

    .thumb:hover {
      transform: scale(1.2, 1.2);
      z-index: 2;
    }

    .thumbs:after {
      content: "";
      flex: 100 0 auto;
    }


    .close {
      position: fixed;
      text-decoration: none;
      top: 1rem;
      right: 2rem;
      color: #f1f1f1;
      font-size: 2rem;
      font-weight: bold;
      transition: 0.3s;

      z-index: 100;
    }
    
    .close:hover, .close:focus {
      color: #bbb;
      cursor: pointer;
    }

    .next {
      position: fixed;
      text-decoration: none;
      top: 50%;
      right: 2rem;
      color: #f1f1f1;
      font-size: 2rem;
      font-weight: bold;
      transition: 0.3s;

      z-index: 100;
    }
    
    .next:hover, .next:focus {
      color: #bbb;
      cursor: pointer;
    }

    .prev {
      position: fixed;
      text-decoration: none;
      top: 50%;
      left: 2rem;
      color: #f1f1f1;
      font-size: 2rem;
      font-weight: bold;
      transition: 0.3s;

      z-index: 100;
    }
    
    .prev:hover, .prev:focus {
      color: #bbb;
      cursor: pointer;
    }

    /* The Modal (background) */
    .modal {
      display: none;   /* Hidden by default */
      position: fixed; /* Stay in place */

      z-index: 100; /* Sit on top */

      left: 0;
      top: 0;

      width: 100%;  /* Full width */
      height: 100%; /* Full height */

      background-color: rgb(0,0,0); /* Fallback color */
      background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
    }

    /* Modal Content (image) */
    .modal-content {
      position: fixed;
      left: 50%;
      top: 50%;

      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);

      max-width: 100dvw;
      max-height: 100dvh;
    }

    .modal:is(:target)  { display: block; }
    .modal:not(:target) { display: none; }

    .modal-fill {
        z-index: -1;
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
    }

  </style>
</head>
<body id="body">
    <h1 class="site-title" style="text-align: center;">Photos</h1>

    <div class="outer-thumbs">
        <div id="thumbs" class="thumbs" :loop="$site.asset('photos.json').ziggy()">
            <a href="$loop.idx.str().prefix('#focus-')" class="thumb-anchor">
                <div :if="$loop.it.get('kind').eql('remote')">
                    <img class="thumb" loading="lazy" src="$loop.it.get('img')" alt="">
                </div>

                <div :if="$loop.it.get('kind').eql('site')">
                    <img class="thumb" loading="lazy" src="$site.asset($loop.it.get('img')).link()" alt="">
                </div>
            </a>

            <div class="modal" id="$loop.idx.str().prefix('focus-')">
                <a href="#!" class="close">×</a>
                <a href="#!" class="modal-fill"></a>

                <span :if="$loop.idx.gt(1)">
                    <a href="$loop.idx.plus(-1).str().prefix('#focus-')" class="prev">&lt;</a>
                </span>

                <span :if="$loop.idx.eq($loop.len).not()">
                    <a href="$loop.idx.plus(1).str().prefix('#focus-')" class="next">&gt;</a>
                </span>

                <div :if="$loop.it.get('kind').eql('remote')">
                    <img loading="lazy" class="modal-content" src="$loop.it.get('img')" alt="">
                </div>

                <div :if="$loop.it.get('kind').eql('site')">
                    <img loading="lazy" class="modal-content" src="$site.asset($loop.it.get('img')).link()" alt="">
                </div>
            </div>
        </div>
    </div>
</body>
